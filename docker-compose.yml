# Local PostgreSQL for development and tests (ADR-005). Same credentials as
# CI, on host port 5433 so it does not clash with another local Postgres.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 10
