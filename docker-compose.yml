# Local services for development and tests. Same credentials as CI.
#   docker compose up -d
# PostgreSQL (ADR-005) on host port 5433, so it does not clash with another
# local Postgres. Object storage is not here: every environment uses a Neon
# branch's bucket (ADR-053).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 10
