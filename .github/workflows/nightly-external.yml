# Tests that call external services (Plaid Sandbox, Nessie, Spectrum terminal). Not a PR gate.
# Requires repository secrets PLAID_CLIENT_ID, PLAID_SANDBOX_SECRET, NESSIE_API_KEY,
# PHOTON_PROJECT_ID, PHOTON_PROJECT_SECRET and repository variable NESSIE_BASE_URL.
name: Nightly external tests

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://test:test@localhost:5432/app_test
  BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  PLAID_ENV: sandbox
  PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
  PLAID_SECRET: ${{ secrets.PLAID_SANDBOX_SECRET }}
  GEMINI_API_KEY: ci-dummy
  GEMINI_MODEL: ci-dummy
  NESSIE_BASE_URL: ${{ vars.NESSIE_BASE_URL }}
  NESSIE_API_KEY: ${{ secrets.NESSIE_API_KEY }}
  PHOTON_PROJECT_ID: ${{ secrets.PHOTON_PROJECT_ID }}
  PHOTON_PROJECT_SECRET: ${{ secrets.PHOTON_PROJECT_SECRET }}
  AGENT_SERVICE_TOKEN: ci-only-not-a-real-token-0123456789abcdef
  AGENT_WORKER_URL: http://localhost:8787
  REEFLECT_URL: http://localhost:3000
  CRON_SECRET: ci-only-not-a-real-cron-secret
  DEMO_MODE: "false"

jobs:
  external:
    name: external
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm test:e2e --grep @external
